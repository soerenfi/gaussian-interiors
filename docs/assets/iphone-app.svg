<svg xmlns="http://www.w3.org/2000/svg" width="1164" height="494" viewBox="0 0 1164 494" role="img"><title>Source-based four-screen iPhone app schematic</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62738a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="32" y="42" font-size="21" fill="#172b45" font-weight="bold">LiDARCapture  /  SOURCE-BASED UI SCHEMATIC</text><rect x="32" y="74" width="249" height="285" rx="27" fill="white" stroke="#dbe2eb" stroke-width="2"/><rect x="114" y="85" width="85" height="7" rx="4" fill="#172b45"/><text x="52" y="130" font-size="13" fill="#3378db" font-weight="bold">01  START</text><text x="52" y="167" font-size="21" fill="#172b45" font-weight="bold">Interior Scan</text><text x="52" y="209" font-size="14" fill="#62738a" font-weight="normal">ARKit  |  Raw UW</text><text x="52" y="239" font-size="14" fill="#62738a" font-weight="normal">Scene name</text><text x="52" y="269" font-size="14" fill="#62738a" font-weight="normal">Draft / Standard / High</text><text x="52" y="299" font-size="14" fill="#62738a" font-weight="normal">Start capture</text><path d="M 288 219 H 307" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="315" y="74" width="249" height="285" rx="27" fill="white" stroke="#dbe2eb" stroke-width="2"/><rect x="397" y="85" width="85" height="7" rx="4" fill="#172b45"/><text x="335" y="130" font-size="13" fill="#3378db" font-weight="bold">02  SCAN</text><text x="335" y="167" font-size="21" fill="#172b45" font-weight="bold">Live viewfinder</text><text x="335" y="209" font-size="14" fill="#62738a" font-weight="normal">FPS / shutter / ISO</text><text x="335" y="239" font-size="14" fill="#62738a" font-weight="normal">Tracking + blur warning</text><text x="335" y="269" font-size="14" fill="#62738a" font-weight="normal">Top-down coverage map</text><text x="335" y="299" font-size="14" fill="#62738a" font-weight="normal">Pause / finish</text><path d="M 571 219 H 590" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="598" y="74" width="249" height="285" rx="27" fill="white" stroke="#dbe2eb" stroke-width="2"/><rect x="680" y="85" width="85" height="7" rx="4" fill="#172b45"/><text x="618" y="130" font-size="13" fill="#3378db" font-weight="bold">03  REVIEW</text><text x="618" y="167" font-size="21" fill="#172b45" font-weight="bold">Inspect coverage</text><text x="618" y="209" font-size="14" fill="#62738a" font-weight="normal">Capture statistics</text><text x="618" y="239" font-size="14" fill="#62738a" font-weight="normal">Recorded room coverage</text><text x="618" y="269" font-size="14" fill="#62738a" font-weight="normal">Save the capture</text><path d="M 854 219 H 873" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="881" y="74" width="249" height="285" rx="27" fill="white" stroke="#dbe2eb" stroke-width="2"/><rect x="963" y="85" width="85" height="7" rx="4" fill="#172b45"/><text x="901" y="130" font-size="13" fill="#3378db" font-weight="bold">04  COMPLETE</text><text x="901" y="167" font-size="21" fill="#172b45" font-weight="bold">Capture saved</text><text x="901" y="209" font-size="14" fill="#62738a" font-weight="normal">Local capture folder</text><text x="901" y="239" font-size="14" fill="#62738a" font-weight="normal">Return to capture</text><text x="901" y="269" font-size="14" fill="#62738a" font-weight="normal">Library + USB transfer</text><text x="32" y="399" font-size="17" fill="#008c87" font-weight="bold">ARKit: wide RGB + poses + scene-depth point cloud</text><text x="32" y="431" font-size="17" fill="#62738a" font-weight="normal">Raw UW: distorted RGB + 200 Hz IMU + optional depth; ARKit is paused</text><text x="32" y="468" font-size="14" fill="#62738a" font-weight="normal">Diagram derived from Swift source. These are not device screenshots o