<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="387" viewBox="0 0 1510 387" role="img"><title>Capture, preprocessing, pose refinement, training and inspection</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#62738a"/></marker></defs><rect width="100%" height="100%" rx="18" fill="#f8fafc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="36" y="47" font-size="22" fill="#172b45" font-weight="bold">FROM PHONE CAPTURE TO GAUSSIAN SCENE</text><rect x="36" y="80" width="264" height="199" rx="12" fill="white" stroke="#dbe2eb"/><text x="54" y="111" font-size="13" fill="#3378db" font-weight="bold">01  CAPTURE</text><text x="54" y="147" font-size="17" fill="#172b45" font-weight="bold">LiDARCapture on iPhone</text><text x="54" y="189" font-size="14" fill="#62738a" font-weight="normal">RGB video + camera poses</text><text x="54" y="216" font-size="14" fill="#62738a" font-weight="normal">Intrinsics + LiDAR points</text><text x="54" y="243" font-size="14" fill="#62738a" font-weight="normal">Raw UW: video + IMU</text><path d="M 304 177 H 321" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="328" y="80" width="264" height="199" rx="12" fill="white" stroke="#dbe2eb"/><text x="346" y="111" font-size="13" fill="#3378db" font-weight="bold">02  PREPROCESS</text><text x="346" y="147" font-size="17" fill="#172b45" font-weight="bold">Frames and geometry</text><text x="346" y="189" font-size="14" fill="#62738a" font-weight="normal">ARKit / video parsers</text><text x="346" y="216" font-size="14" fill="#62738a" font-weight="normal">Rotation-aware cameras</text><text x="346" y="243" font-size="14" fill="#62738a" font-weight="normal">Voxel-downsampled seed</text><path d="M 596 177 H 613" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="80" width="264" height="199" rx="12" fill="white" stroke="#dbe2eb"/><text x="638" y="111" font-size="13" fill="#3378db" font-weight="bold">03  REFINE</text><text x="638" y="147" font-size="17" fill="#172b45" font-weight="bold">Multi-view alignment</text><text x="638" y="189" font-size="14" fill="#62738a" font-weight="normal">COLMAP feature matching</text><text x="638" y="216" font-size="14" fill="#62738a" font-weight="normal">Pose-prior BA or full SfM</text><text x="638" y="243" font-size="14" fill="#62738a" font-weight="normal">Similarity alignment</text><path d="M 888 177 H 905" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="912" y="80" width="264" height="199" rx="12" fill="white" stroke="#dbe2eb"/><text x="930" y="111" font-size="13" fill="#3378db" font-weight="bold">04  TRAIN</text><text x="930" y="147" font-size="17" fill="#172b45" font-weight="bold">3DGUT + MCMC</text><text x="930" y="189" font-size="14" fill="#62738a" font-weight="normal">COLMAP dataset export</text><text x="930" y="216" font-size="14" fill="#62738a" font-weight="normal">Optional depth / normals</text><text x="930" y="243" font-size="14" fill="#62738a" font-weight="normal">PPISP in ARKit recipe</text><path d="M 1180 177 H 1197" stroke="#62738a" stroke-width="2" marker-end="url(#arrow)"/><rect x="1204" y="80" width="264" height="199" rx="12" fill="white" stroke="#dbe2eb"/><text x="1222" y="111" font-size="13" fill="#3378db" font-weight="bold">05  INSPECT</text><text x="1222" y="147" font-size="17" fill="#172b45" font-weight="bold">Outputs and evidence</text><text x="1222" y="189" font-size="14" fill="#62738a" font-weight="normal">Checkpoints + evaluation</text><text x="1222" y="216" font-size="14" fill="#62738a" font-weight="normal">Point clouds + viewers</text><text x="1222" y="243" font-size="14" fill="#62738a" font-weight="normal">Failure analysis</text><text x="36" y="326" font-size="17" fill="#62738a" font-weight="normal">The raw ultra-wide mode needs SfM: it does not export ARKit poses.</text><text x="36" y="354" font-size="17" fill="#62738a" font-weight="normal">Depth, DSINE normals and SDF are experimental branches; the measured baseline uses RGB + SfM.</text></g></svg>